services:
  app:
    image: ${APP_IMAGE:?set approved locally loaded APP_IMAGE}
    pull_policy: never
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Provider: LocalFile
      Storage__LocalFilePath: /data/repositories.json
      Security__TrustReverseProxyHeaders: "true"
      Llm__Enabled: ${LLM_ENABLED:-false}
      Llm__Endpoint: ${LLM_ENDPOINT:-https://llm.invalid/v1/chat/completions}
      Llm__AllowedOrigin: ${LLM_ALLOWED_ORIGIN:-https://llm.invalid}
      Llm__Model: ${LLM_MODEL:-internal-code-model}
      Llm__AllowDevelopmentStub: "false"
    volumes:
      - ${REPOSITORY_ROOT:?set REPOSITORY_ROOT}:/repositories:ro
      - ${POLICY_ROOT:?set approved POLICY_ROOT}:/policy:ro
      - ${DATA_ROOT:?set non-synchronized DATA_ROOT}:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true

  postgres:
    profiles: [database]
    image: ${POSTGRES_IMAGE:?set approved locally loaded POSTGRES_IMAGE}
    pull_policy: never
    environment:
      POSTGRES_DB: diagram_maker
      POSTGRES_USER: diagram_maker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagram_maker -d diagram_maker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
